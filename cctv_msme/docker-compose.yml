# Factory Intelligence Platform - full stack
#   docker compose up --build
# First boot: downloads the CLIP model (~340 MB) into the clip-cache volume.
# Default logins: admin/admin123, supervisor/supervisor123, worker/worker123

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Copy .env to configure these; values below are safe defaults.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion400m_e32}
      CLIP_INFERENCE_THREADS: ${CLIP_INFERENCE_THREADS:-4}
      FRAME_SAMPLE_INTERVAL_DEFAULT: ${FRAME_SAMPLE_INTERVAL_DEFAULT:-0.2}
      PREVIEW_FPS: ${PREVIEW_FPS:-2}
      VIDEO_UPLOAD_MAX_MB: ${VIDEO_UPLOAD_MAX_MB:-2048}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      NUMPY_STORE_MAX_VECTORS: ${NUMPY_STORE_MAX_VECTORS:-50000}
      COMPACTION_HOUR_UTC: ${COMPACTION_HOUR_UTC:-3}
      DETECTOR_ENABLED_DEFAULT: ${DETECTOR_ENABLED_DEFAULT:-1}
      DETECTOR_MODEL: ${DETECTOR_MODEL:-yolov8n}
      DETECTOR_CONFIDENCE_THRESHOLD: ${DETECTOR_CONFIDENCE_THRESHOLD:-0.35}
      TRACKER_ENABLED_DEFAULT: ${TRACKER_ENABLED_DEFAULT:-1}
      ATTRIBUTES_ENABLED_DEFAULT: ${ATTRIBUTES_ENABLED_DEFAULT:-1}
      REID_ENABLED_DEFAULT: ${REID_ENABLED_DEFAULT:-1}
      REID_COLLECTION: ${REID_COLLECTION:-factory_intel_reid}
      REID_MODEL: ${REID_MODEL:-osnet_x1_0_msmt17}
      REID_WEIGHTS_PATH: ${REID_WEIGHTS_PATH:-}
      STITCH_WEIGHTS: ${STITCH_WEIGHTS:-1.0,1.0,1.0}
      BATCH_REPROCESS_ENABLED_DEFAULT: ${BATCH_REPROCESS_ENABLED_DEFAULT:-1}
      BATCH_REPROCESS_AFTER_HOURS: ${BATCH_REPROCESS_AFTER_HOURS:-24}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      SEED_DEMO_SIM_CAMERAS: ${SEED_DEMO_SIM_CAMERAS:-1}
      EDGE_ADAPTIVE_LOAD: ${EDGE_ADAPTIVE_LOAD:-1}
    volumes:
      - factory-data:/app/data
      - clip-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  factory-data:
  clip-cache:
